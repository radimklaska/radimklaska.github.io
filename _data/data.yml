experiences:
    - role: Drupal Developer, Technical Lead & Updates Manager
      time: 2014 - Present
      company: Morpht Pty. Ltd.
      details: |
        I had a number of roles at [Morpht](https://www.morpht.com) over the years. I started as a Drupal developer and site builder,
        did my fair share of theme coding and `HOOK_form_alter`ing, moved to backend development and became technical lead on many projects.
        Over the years I worked on 150+ projects, mostly for Australian government clients - see [selected projects](#references) below.

        - **Updates Manager** - I manage and coordinate security and maintenance updates across all Morpht projects: about 1,500
          update tickets on more than 80 projects since 2015, from Drupal core security releases to PHP, Node.js and Composer upgrades
          using internal update tooling that keeps this repeatable.
        - **Incident response** - when a site goes down or a highly critical security release lands, I triage it, plan the fix,
          split the work across the team and coordinate the release on all affected sites.
        - **Upgrades and migrations** - Drupal 7 to 8/9/10/11 upgrades, multi-site upgrade programmes, moving sites between
          Acquia, Pantheon and GovCMS (Lagoon) hosting.
        - **Integrations** - CRM synchronisation, recurring payments and paid content, data feeds and search with Solr.
        - **Convivial** - long-time core developer of Morpht's Drupal product and its GovCMS / Drupal CMS editions
          (Drupal recipes, release automation, demo sites).
        - **Local environments** - I take care of our developers and make sure their local environments always work, using
          [Lando](https://lando.dev) and [DDEV](https://ddev.com) with custom tooling, data synchronisation / sanitization and tests.
        - **DevOps** - CI/CD in GitHub Actions, automated Let's Encrypt certificates, visual regression testing.
        - **AI** - semantic search and a chatbot on a Drupal site, and AI-assisted development and review workflows.
        - **Team coordination and mentoring** - daily stand-ups of the Czech team, onboarding new developers and day-to-day help.
    - role: Drupal developer
      time: 2011 - 2014
      company: PLAYzone s. r. o.
      details: |
        Learned a lot by working with a great team, receiving code reviews, having a chance to architect solutions and watching projects grow.
        I worked on intranet systems, sites for political parties, news sites, real estate portals, event sites
        with live judging and scoring including dashboards and digital signage, and a number of company presentation websites.
    - role: Drupal site builder
      time: 2006 - 2011
      company: Freelance
      details: |
        I was lucky to gain trust and awesome references from many clients. This was a steep learning curve while juggling meetings with clients,
        working on sites and managing a small team of my schoolmates who helped me with design and site-building.
        I also started managing my first [Aegir](https://www.aegirproject.org) server to host all client sites.
