references:
    title: Selected projects at Morpht
    intro: >
      Projects that Morpht presents publicly and that I worked on. Screenshots taken in November 2026.
    # Item format:
    # - title: Project name
    #   client: Client organisation
    #   image: file in assets/images/references/ (640x400 JPEG)
    #   my_role: What I did, and when (from my own records)
    #   summary: Short description of the project (own words, based on the case study)
    #   award: Optional
    #   site: Live site URL (omit when the site is retired)
    #   sources: list of {title, link} pointing to the public case studies
    items:
      - title: Australian Children's Education and Care Quality Authority
        image: acecqa.jpg
        my_role: Development and long-term support, 2017 - 2026, including the move to Drupal 11.
        summary: >
          Redesigned website with content migrated from a legacy CMS. A rebuilt import keeps the National Register
          of about 16,000 approved services in sync with a third-party SOAP feed, with retries and change detection.
        site: https://www.acecqa.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/acecqa
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/australian-childrens-education-care-quality-authority-new-website

      - title: NSW Trustee and Guardian (NSW Government)
        image: nswtg.jpg
        my_role: Long-term support and updates, 2020 - 2026, including build and theming work in 2024.
        summary: >
          Integration of Microsoft Dynamics CRM, the booking portal, Google Maps and Drupal. Pop-up service locations
          are entered once in the CRM, appear on the site automatically and residents can find the nearest one and book.
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/nsw-trustee-and-guardian
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/nsw-trustee-and-guardian-systems-integration-for-pop-up-locations

      - title: Attorney-General's Department
        image: agd.jpg
        my_role: Led the Drupal 10 upgrade of the department's GovCMS sites (2023) and ongoing support, 2019 - 2026.
        summary: >
          Redesign of the main AGD website, one of five department sites Morpht built on GovCMS. Around 1,200 pages and
          6,000 publications were reorganised into sections with faceted publication libraries.
        site: https://www.ag.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/attorney-generals-department
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/attorney-generals-department-redesign-development-of-5-sites

      - title: Medical Device Single Audit Program
        image: mdsap.jpg
        my_role: Developer - move to GovCMS, build and support, 2024 - 2026.
        summary: >
          New brand and GovCMS website for the international medical device audit program, built around a document
          library searchable by category, process or type.
        award: Splash Awards 2026 - Design/UX
        site: https://www.mdsap.global/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/mdsap
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/medical-device-single-audit-program-new-drupal-cms-site
        credit: https://new.drupal.org/case-study/medical-device-single-audit-program-new-drupal-cms-site#:~:text=radimklaska

      - title: Redfern Legal Centre
        image: rlc.jpg
        my_role: Platform setup, Drupal 10 upgrade and long-term support, 2021 - 2026.
        summary: >
          Rebuild of the community legal centre's site from Drupal 7 to Drupal 9, with 1,700 migrated articles
          and resources, online client intake forms and an accessible design the staff can run in-house.
        award: Splash Awards 2023 - Not-for-profit
        site: https://rlc.org.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/redfern-legal-centre-rlc
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/redfern-legal-centre-opening-the-digital-doors-drupalsouth-splash-awards-winner-2023

      - title: GovFlix
        client: Morpht (showcase for the GovCMS community)
        image: govflix.jpg
        my_role: Developer - AI semantic search and chatbot, content importer, updates, 2024 - 2026.
        summary: >
          Video library for people who build government websites, proving that personalisation works on GovCMS SaaS:
          Recombee recommendations, semantic search and an AI chatbot answering from site content.
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/govflix
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/govflix-content-recommendation-system
        credit: https://new.drupal.org/case-study/govflix-content-recommendation-system#:~:text=radimklaska

      - title: NSW Food Authority
        image: foodauthority.jpg
        my_role: Theme setup during the build (2019), Drupal 10 and 11 upgrades and support, 2019 - 2026.
        summary: >
          Migration from a legacy CMS to GovCMS SaaS with the NSW Design System. External data feeds power public
          registers and live shellfish harvest-area alerts.
        site: https://www.foodauthority.nsw.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/nsw-food-authority
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/nsw-food-authority-migratation-to-govcms

      - title: Paragraphs Demo
        client: Morpht (showcase)
        image: paragraphs-demo.jpg
        my_role: Development, 2016 - 2021; co-maintainer of the Modifiers module it showcases.
        summary: >
          Showcase of component-based page building with Drupal Paragraphs and Morpht's contributed modules
          such as Modifiers.
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/paragraphs-demo

      - title: Australian Energy Regulator
        image: aer.jpg
        my_role: Environments and CI deployment during the move to GovCMS PaaS, 2022 - 2023, and later updates.
        summary: >
          Rebuild of a 10-year-old Drupal 7 site on GovCMS: about 27,000 pages and 42,000 documents migrated without
          data loss, 32 legacy content types consolidated, externally audited for WCAG 2.1 AA.
        site: https://www.aer.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/aer
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/australian-energy-regulator-digital-transformation

      - title: Independent Parliamentary Expenses Authority
        image: ipea.jpg
        my_role: Development environments, data import fixes and support, 2021 - 2026.
        summary: >
          New site where quarterly datasets of 30,000+ expense records are imported in one step and generate
          parliamentarian pages and reports, replacing hundreds of hand-uploaded PDFs.
        site: https://www.ipea.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/ipea
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/independent-parliamentary-expenses-authority-new-govcms-site

      - title: Therapeutic Goods Administration
        image: tga.jpg
        my_role: Environment setup and data import during the build, 2021 - 2022, later updates.
        summary: >
          Technical redevelopment of a site with 5.5 million+ visitors a month: 95,000 register records published
          as searchable pages and filtered search across safety alerts, publications and 17 data feeds.
        site: https://www.tga.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/therapeutic-goods-administration
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/therapeutic-goods-administration-digital-transformation

      - title: Australian Air Force Cadets
        image: aafc.jpg
        my_role: Site preparation, Drupal 10 upgrade and support, 2021 - 2026.
        summary: >
          Redesigned site built from user journeys of prospective cadets, parents and volunteers, with a React and
          Google Maps squadron finder fed by AAFC systems.
        site: https://www.airforcecadets.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/australian-air-force-cadets-aafc
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/australian-airforce-cadets-creating-a-better-user-journey

      - title: Reef Guardian Schools
        client: Great Barrier Reef Marine Park Authority
        image: rgs.jpg
        my_role: Data migration (schools, users and resources) and Drupal 11 preparation, 2025.
        summary: >
          Rebuild and move from GovCMS PaaS to SaaS: 382 schools, 800+ users and 150+ resources migrated without
          anyone re-registering, plus a teacher resource library, schools map and online action plans.
        site: https://www.reefed.edu.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/rgs
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/reef-guardian-school-govcms-saas-redevelopment
        credit: https://new.drupal.org/case-study/reef-guardian-school-govcms-saas-redevelopment#:~:text=radimklaska

      - title: GreenPower renewable energy program
        image: greenpower.jpg
        my_role: Build pipeline, 2020.
        summary: >
          Site rebuild with a React and Google Maps generator locator, a directory of 400+ accredited providers and an
          energy offset calculator.
        site: https://www.greenpower.gov.au/
        sources:
          - title: Morpht case study
            link: https://www.morpht.com/work/greenpower
          - title: Drupal.org case study
            link: https://new.drupal.org/case-study/greenpower-energy-generators-locator
        credit: https://new.drupal.org/case-study/greenpower-energy-generators-locator#:~:text=radimklaska

