tldr:
    title: TL;DR
    summary: |
      I build best-practice **Drupal** websites, backed by solid **CI/CD pipelines**, fast **security** updates and automated tests,
      and guarded by granular **caching**. On the side, a lot of **home automation**, working with (and fixing) all kinds
      of **hardware**, well beyond **IoT**, and **physical security** as a hobby.

career-profile:
    title: Profile
    summary: |
      I started working with computers around the year 2000 and got into developing websites in 2004.
      I discovered Drupal during the 4.7 / 5.4 era (2007) and stayed with it ever since.

      By working with various clients I gained lots of experience in site building, programming, theming, DevOps and Linux sysadmin work.
      Since then I worked on big sites as a backend developer and technical lead, and shifted towards security, updates automation and testing,
      DevOps and CI/CD: keeping dozens of Drupal sites patched, upgraded and deployable, and jumping in when something breaks.

      I'm also known as one of the leading members of the Czech Drupal community and the chairman of the
      Czech Drupal Association.

      I'm passionate about using best practices and like to discover new elegant solutions.
      I'm an Open Source enthusiast, long term Linux user and a hardware tinkerer. This led me through some interesting side quests -
      reverse engineering electric vehicles, designing PCBs and wiring everything into Home Assistant.
      Lately I also build AI agent tooling to automate the boring parts of development.
      
      Read on...
