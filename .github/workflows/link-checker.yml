name: Link Checker

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 7:00 UTC
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-24.04 # ruby/setup-ruby has no Ruby 3.3.6 build for ubuntu-26.04 (ubuntu-latest)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # slack.com rate-limits the runner: the sidebar carries three
          # slack links and is rendered on every page, so the request count
          # grows with the site and returns intermittent 403s.
          # morpht.com and x.com return 403 Forbidden to the runner (bot
          # blocking), so they cannot be verified from CI.
          # The client sites in the "Selected projects" section (Australian
          # government sites, rlc.org.au, mdsap.global, reefed.edu.au) sit
          # behind bot protection that answers 403 or drops the connection
          # for non-browser clients.
          # The cvut.cz link is checked in the next step instead: that server
          # does not send its intermediate certificate, so TLS verification
          # fails even though the page loads fine in browsers.
          args: '--no-progress --root-dir _site/ --exclude cvut.cz/en/faculty-of-nuclear-sciences-and-physical-engineering --exclude linkedin.com --exclude reddit.com --exclude instagram.com --exclude timeanddate.com --exclude alza.cz --exclude slack.com --exclude morpht.com --exclude x.com --exclude /onewheel --exclude \.gov\.au --exclude rlc\.org\.au --exclude mdsap\.global --exclude reefed\.edu\.au _site/'
          fail: true

      # Links whose server has a broken certificate chain: still verify that
      # they respond, but without TLS certificate verification (curl -k).
      # Keep these URLs in sync with the --exclude entries above.
      - name: Check links with broken TLS chains
        if: ${{ !cancelled() }}
        run: |
          status=0
          for url in \
            https://www.cvut.cz/en/faculty-of-nuclear-sciences-and-physical-engineering
          do
            if code=$(curl -sSk -L --fail --max-time 30 -o /dev/null -w '%{http_code}' "$url"); then
              echo "OK   $code $url"
            else
              echo "FAIL ${code:-000} $url"
              status=1
            fi
          done
          exit $status

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"Broken links detected on klaska.net! Check the report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
