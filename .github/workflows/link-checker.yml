name: Link Checker

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 7:00 UTC
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: '.ruby-version'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--no-progress --root-dir _site/ --exclude linkedin.com --exclude reddit.com --exclude instagram.com --exclude timeanddate.com --exclude /onewheel _site/'
          fail: true

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"Broken links detected on klaska.net! Check the report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
